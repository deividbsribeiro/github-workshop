plugins {
    id 'com.android.application'
}

android {
    namespace 'br.com.deivid.cftvlocal'
    compileSdk 36

    defaultConfig {
        applicationId 'br.com.deivid.cftvlocal'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '2.0.0-prep'

        ndk {
            abiFilters 'armeabi-v7a', 'arm64-v8a'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.media3:media3-exoplayer:1.11.0'
    implementation 'androidx.media3:media3-exoplayer-rtsp:1.11.0'
    implementation 'androidx.media3:media3-ui:1.11.0'

    // Xiongmai / JFTech FunSDK (P2P / cloud access)
    implementation 'com.jftechsoft.funsdk:funsdk:5.1.3'
    implementation 'io.github.xmcamera:uilibrary:2.1'
    implementation 'com.alibaba:fastjson:1.1.72.android'
    implementation 'org.apache.commons:commons-lang3:3.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.9.2'
    implementation 'com.squareup.okhttp3:okhttp:4.9.2'
}
